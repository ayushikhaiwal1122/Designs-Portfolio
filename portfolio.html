<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: black;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        .category {
            margin: 20px 0;
        }
        .work-item {
            margin: 10px;
            padding: 10px;
            background-color: #222;
            display: inline-block;
            border-radius: 10px;
        }
        .work-item img {
            width: 200px;
            height: auto;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to My Portfolio</h1>
        
        <div class="category">
            <h2>Logos</h2>
            <div class="work-item">
                <img src="images/logo1.jpg" alt="Logo 1">
            </div>
            <div class="work-item">
                <img src="images/logo2.jpg" alt="Logo 2">
            </div>
        </div>

        <div class="category">
            <h2>Templates</h2>
            <div class="work-item">
                <img src="images/template1.jpg" alt="Template 1">
            </div>
            <div class="work-item">
                <img src="images/template2.jpg" alt="Template 2">
            </div>
        </div>

        <div class="category">
            <h2>Social Media Designs</h2>
            <div class="work-item">
                <img src="images/design1.jpg" alt="Design 1">
            </div>
            <div class="work-item">
                <img src="images/design2.jpg" alt="Design 2">
            </div>
        </div>
    </div>
</body>
</html>
